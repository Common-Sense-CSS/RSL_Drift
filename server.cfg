## RSL Drift Server — server.cfg
## See README.md in this folder for full setup instructions.

# Panels like AMP auto-inject endpoint_add_tcp/endpoint_add_udp for the
# interface/port they assign your instance — adding them here too causes a
# "CANNOT execute endpoint_add_udp twice" error. Only uncomment these if
# you're running bare FXServer without a panel that manages this for you.
# endpoint_add_tcp "0.0.0.0:30120"
# endpoint_add_udp "0.0.0.0:30120"

sv_maxclients 48
sv_hostname "RSL Drift Server"
sets sv_projectName "RSL Drift"
sets sv_projectDesc "A custom drift server built on the RSL framework"

# Get your own key at https://keymaster.fivem.net/
sv_licenseKey "changeme"

# oxmysql connection string — update with your database credentials
set mysql_connection_string "mysql://user:password@localhost/rsl_drift?charset=utf8mb4"

# Reject client-side modifications to replicated state bags (recommended by ox_lib)
setr sv_stateBagStrictMode true

# Base FiveM system resources — handle the connect/session/spawn handshake.
# These are NOT bundled in the FXServer artifact — download citizenfx/cfx-server-data
# and drop its resources/ folder into resources/[cfx]/ (see README.md). Without
# these clients can hang indefinitely on "awaiting scripts".
ensure mapmanager
ensure chat
ensure spawnmanager
ensure sessionmanager
ensure basic-gamemode
ensure hardcap
ensure rconlog

# Required third-party dependencies (download separately, see README.md)
ensure oxmysql
ensure ox_lib

# RSL framework
ensure rsl_core
ensure rsl_drift

sv_enforceGameBuild 2944

# Steam Web API key (optional, recommended) — https://steamcommunity.com/dev/apikey
# set steam_webApiKey "changeme"

# Admin permissions for RSL's admin commands (givecash, setlevel, car, tp,
# deletevehicle — see resources/[rsl]/rsl_core/modules/admin/admin_s.lua).
# Replace CHANGEME with your FiveM license identifier (found in the F8
# console as "license:xxxxxxxx" after connecting once).
# add_principal identifier.license:CHANGEME group.admin
# add_ace group.admin command allow
